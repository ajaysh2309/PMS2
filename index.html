<style>

a{color:var(--blue)}svg text{font-family:inherit}::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:8px}

.lvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:6px}.lvc{margin:0;padding:16px}.lvc h3{margin:8px 0 4px}.lvc p{margin:0 0 6px}

function list(p,cols,k,def){const a=get(p)||[];return`<table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr>${a.map((r,i)=>`<tr>${cols.map(c=>`<td>${inp(p+'.'+i+'.'+c[0],k,c[2],c[3])}</td>`).join('')}<td>${can(k)?`<button data-del="${p}.${i}">✕</button>`:''}</td></tr>`).join('')}</table>${can(k)?`<button data-add="${p}" data-def='${JSON.stringify(def)}'>+ Add row</button>`:''}`}
const radar=(a,b,L)=>{const n=L.length,R=75,pt=(i,v)=>{const g=-Math.PI/2+i*2*Math.PI/n;return[100+R*v/5*Math.cos(g),100+R*v/5*Math.sin(g)].map(x=>x.toFixed(1))};
 const poly=(arr,col)=>`<polygon points="${arr.map((v,i)=>pt(i,+v||0)).join(' ')}" fill="${col}" fill-opacity=".25" stroke="${col}" stroke-width="2"/>`;
 return`<svg viewBox="0 0 200 200" width="260" role="img" aria-label="Competency radar">${[1,2,3,4,5].map(r=>`<polygon points="${L.map((_,i)=>pt(i,r)).join(' ')}" fill="none" stroke="#9aa0a6" stroke-opacity=".4"/>`).join('')}${L.map((l,i)=>{const[x,y]=pt(i,5.9);return`<text x="${x}" y="${y}" font-size="7" text-anchor="middle" fill="currentColor">${esc(l.split(' ')[0])}</text>`}).join('')}${poly(a,'#4285f4')}${poly(b,'#ea4335')}</svg><div class="m"><span style="color:#4285f4">■ Self</span> &nbsp; <span style="color:#ea4335">■ Manager</span></div>`};
const bars=(vals,labs,max)=>`<div>${vals.map((v,i)=>`<div class="m" style="display:flex;gap:8px;align-items:center"><span style="width:90px">${esc(labs[i])}</span><div class="bar" style="flex:1"><i style="width:${Math.min(100,(+v||0)/max*100)}%"></i></div><span style="width:34px">${v===''||v==null?'–':v}</span></div>`).join('')}</div>`;
// ---------- Views ----------
function dir(){CUR=null;const c=S.ctx,A=ALL(),flat=S.q||S.dept,mm=me(),depts=[...new Set(A.map(e=>e.dept))],canAdd=!mm?true:mm.lv!=='I';
 const done=Object.values(S.d).reduce((n,d)=>n+d.rev.filter(r=>r.st==='Completed').length,0),open=A.filter(scope).length,ed=mm?A.filter(e=>above(mm.id,e)).length:A.length;
 const card=e=>{const ok=scope(e);return`<div class="card emp ${ok?'':'off'}" ${ok?`data-open="${e.id}"`:''}>${av(e.name)}<div class="ei"><b>${e.name}</b><span>${e.title}</span><span class="m">${e.dept}</span><div><span class="tag t${e.lv}">${LVL[e.lv].n}</span><span class="tag">${e.reg==='in'?'India':'America'}</span><span class="tag demo">${e.custom?'ADDED':'DEMO'}</span>${ok?'':'<span class="tag">🔒</span>'}</div></div></div>`};
 const nd=e=>{const ok=scope(e),k=kids(e.id);return`<li><div class="node ${ok?'':'off'} ${c!=='global'&&e.reg!==c?'dim':''} n${e.lv}" ${ok?`data-open="${e.id}"`:''}>${av(e.name,44)}<div class="ei"><b>${e.name}</b><span>${e.title}</span><div><span class="tag t${e.lv}">${LVL[e.lv].n}</span><span class="tag">${e.dept}</span>${k.length?`<span class="tag">👥 ${k.length}</span>`:''}${ok?'':'<span class="tag">🔒</span>'}</div></div></div>${k.length?`<ul>${k.map(nd).join('')}</ul>`:''}</li>`};
 const roots=A.filter(e=>!e.mg||!A.some(x=>x.id==e.mg)),mgrs=A.filter(x=>x.lv!=='I'&&(!mm||x.id==mm.id||above(mm.id,x)));
 const lst=A.filter(e=>(c==='global'||e.reg===c)&&(!S.dept||e.dept===S.dept)&&(e.name+e.title+e.dept).toLowerCase().includes(S.q.toLowerCase()));
 return`<section class="hero"><div><h1>One org.<br><em>Three kinds of performance.</em></h1><p>${mm?`Viewing as <b>${mm.name}</b> (${LVL[mm.lv].n}). You can open ${open} record${open>1?'s':''} and edit the manager review of ${ed} report${ed==1?'':'s'}.`:'Admin (HR) view: full access to every record.'}</p></div><div class="stats"><div class="stat"><b>${A.length}</b><span>People</span></div><div class="stat"><b>${A.filter(x=>x.lv!=='I').length}</b><span>Leaders &amp; managers</span></div><div class="stat"><b>${done}</b><span>Reviews done</span></div></div></section>
 <div class="lvs">${['I','M','L'].map(l=>`<div class="card lvc"><span class="tag t${l}">${LVL[l].n}</span><h3>${LVL[l].lab}</h3><p class="m">${LVL[l].tool}</p><div class="m">Criteria: ${LVL[l].w.map(w=>w[0]).join(' · ')}</div></div>`).join('')}</div>
 <div class="note"><b>How access works:</b> everyone is reviewed by their manager. Managers see and edit their reports' (and below) records; leaders see the managers and employees under them; people edit their own self-input. Locked 🔒 cards are visible in the org chart but not openable. <b>Names are fictional demo data.</b></div>
 ${canAdd?`<details class="card" id="addm"><summary><b>+ Add member</b> <small>(gets all six sections automatically)</small></summary><div class="row"><div><label>Full name</label><input id="nn"><label>Designation</label><input id="nt"><label>Level</label><select id="nl"><option value="I">Individual Contributor</option><option value="M">Manager</option><option value="L">Leader</option></select></div><div><label>Department</label><input id="nd" list="dl"><datalist id="dl">${depts.map(d=>`<option value="${d}">`).join('')}</datalist><label>Reports to</label><select id="np">${mgrs.map(x=>`<option value="${x.id}" ${mm&&x.id==mm.id?'selected':''}>${x.name} — ${x.title}</option>`).join('')}</select><label>Role family (IC KPI template)</label><select id="nf">${Object.keys(FAM).map(k=>`<option value="${k}">${FAM[k].t}</option>`).join('')}</select><label>Region</label><select id="nr"><option value="in" ${c==='in'?'selected':''}>Google India</option><option value="us" ${c==='us'?'selected':''}>Google America</option></select></div></div><p><button class="pri" id="addgo">Add member</button></p></details>`:''}
 <div class="card row"><div><input id="q" placeholder="🔍 Search name, title, department… (shows list)" value="${esc(S.q)}"></div><div><select id="dept"><option value="">All departments</option>${depts.map(d=>`<option ${d==S.dept?'selected':''}>${d}</option>`).join('')}</select></div></div>
 ${flat?`<h3>${CT[c].ic} ${CT[c].n} — ${lst.length} people</h3><div class="grid">${lst.map(card).join('')||'<p>No matches.</p>'}</div>`:`<h3>🏢 Organisation chart ${c!=='global'?`<small>— ${CT[c].n} members highlighted</small>`:''}</h3><ul class="tree">${roots.map(nd).join('')}</ul>`}
 <div class="card"><b>Sources &amp; reading</b> <small>(pointers; verify current versions)</small><br><small>Google re:Work — <a href="https://rework.withgoogle.com/" target=_blank rel=noopener>OKRs, goal setting, manager effectiveness (incl. Project Oxygen)</a> · SHRM — performance management toolkits · US EEOC — <a href="https://www.eeoc.gov" target=_blank rel=noopener>employment discrimination law</a> · India Ministry of Labour &amp; Employment — <a href="https://labour.gov.in" target=_blank rel=noopener>labour codes</a> · Gallup — manager coaching and engagement research.</small></div>`}
function ws(e){CUR=e;const d=ens(e),c=S.ctx,X=CT[c];const T=['🧭 Job &amp; KPIs','📊 Assessment','🏆 Rewards','🗓️ Reviews','🌱 Development','🤝 Mentoring'];
 let h=`<button id="back">← Directory</button><div class="card profile" style="margin-top:12px">${av(e.name,72)}<div><h2>${e.name} <span class="tag demo">${e.custom?'ADDED':'DEMO'}</span></h2><div class="sub">${e.title} · ${e.dept} · ${LVL[e.lv].n} · ${e.reg==='in'?'Google India':'Google America'} · Reports to ${bossName(e)}</div>${kids(e.id).length?`<div style="margin-top:8px"><span class="m">Direct reports:</span> ${kids(e.id).map(k=>`<span class="tag ${scope(k)?'link':''}" ${scope(k)?`data-open="${k.id}"`:''}>${k.name}</span>`).join('')}</div>`:''}<br>${e.custom&&can('m')?`<div class="row" style="margin-top:8px"><div><label>Designation</label><input data-cf="title" value="${esc(e.title)}"></div><div><label>Department</label><input data-cf="dept" value="${esc(e.dept)}"></div><div><label>&nbsp;</label><button data-delm="${e.id}">Delete member</button></div></div>`:''}<br><span class="m">Viewing under: ${X.ic} ${X.n} context · Reviewed by: ${bossName(e)}</span></div></div><div class="tabs">${T.map((t,i)=>`<button data-tab="${i}" class="${S.tab==i?'on':''}">${t}</button>`).join('')}</div>`;
 const P=e.id+'.';
 if(S.tab==0)h+=`<div class="card"><h3>Job analysis</h3>${inp(P+'jd.'+c+'.ja','m','area')}<h3>Job description</h3>${inp(P+'jd.'+c+'.jd','m','area')}<div class="note"><b>${X.n} lens:</b> ${X.cult}</div></div><div class="card"><h3>Role-specific KPIs / parameters</h3>${list(P+'k.'+c,[['n','KPI'],['t','Target'],['a','Actual (manager)','text'],['p','Attainment %','number']],'m',{n:'',t:'',a:'',p:''})}<p class="m">Actuals are blank by design — enter real data from your systems.</p></div>`;
 if(S.tab==1){const WW=WT(e,c),L=WW.map(w=>w[0]);const sc=L.map(l=>d.self[l]||0),mg=L.map(l=>d.mgr[l]||0);const tot=WW.reduce((s,w)=>s+w[1]*(+d.mgr[w[0]]||0),0)/100;
  h+=`<div class="note"><b>${LVL[e.lv].n} framework — ${LVL[e.lv].lab}.</b> ${LVL[e.lv].tool} Region lens: US +5 pts on the first criterion (measurable results); India +5 pts on the second (collaboration / people).</div><div class="card"><h3>Competency assessment (weights for ${X.n})</h3><table><tr><th>Criterion</th><th>Weight</th><th>Self (1–5)</th><th>Manager (1–5)</th></tr>${WW.map(w=>`<tr><td>${w[0]}</td><td>${w[1]}%</td><td>${inp(P+'self.'+w[0],'e','number')}</td><td>${inp(P+'mgr.'+w[0],'m','number')}</td></tr>`).join('')}</table><p>Weighted manager score: <b>${tot?tot.toFixed(2):'–'}</b> / 5 &nbsp; ${can('m')?`<button id="demofill">Load illustrative DEMO scores</button>`:''}</p></div>
  <div class="row"><div class="card"><h3>Radar</h3>${radar(sc,mg,L)}</div><div class="card"><h3>Review rating trend</h3>${bars(d.rev.map(r=>r.r),MON,5)}<h3 style="margin-top:14px">KPI attainment</h3>${bars(d.k[c].map(k=>k.p),d.k[c].map(k=>k.n.slice(0,16)),100)}</div></div>
  <div class="card"><h3>Assessment toolkit</h3><table><tr><th>Type</th><th>Tool</th><th>Use</th></tr>${RT.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>`}
 if(S.tab==2){const last=d.rev.filter(r=>r.dec!='Pending').at(-1);h+=`<div class="card"><h3>Rewards &amp; recognition</h3><div class="note">${X.rew}</div>${last?`<p class="m">Latest review decision: <b>${last.dec}</b></p>`:'<p class="m">No review finalised yet — complete the controllability check in Reviews before rewards.</p>'}${list(P+'rw',[['dt','Date','date'],['ty','Type','sel',RW],['ti','Title'],['nt','Rationale / notes'],['v','Value']],'m',{dt:'',ty:RW[0],ti:'',nt:'',v:''})}</div>`}
 if(S.tab==3)h+=`<div class="note"><b>Controllability protocol (before appraisal/reward):</b> 1) Employee selects contextual factor + comments. 2) Manager verifies with evidence. 3) Manager splits the outcome gap into controllable vs external %. 4) Rate inputs/behaviours separately from outcomes. 5) Calibrate with peer managers. 6) Only then mark "Ready for appraisal".<br><b>${X.n} guidance:</b> ${X.guide}<br><b>${LVL[e.lv].n} focus:</b> ${LVL[e.lv].g}</div>`+d.rev.map((r,i)=>{const p=P+'rev.'+i+'.',sug=r.r?Math.min(5,(+r.r)+(5-r.r)*(r.ext/100)*.5).toFixed(2):'–';
  return`<details class="card" ${i==0?'open':''}><summary><b>Review ${i+1} · ${MON[i]} · ${THEME[i]}</b> <span class="tag">${r.st}</span></summary><div class="row"><div><label>Status (manager)</label>${inp(p+'st','m','sel',['Not started','In progress','Completed'])}<h4>Employee input</h4><label>Contextual / external factor</label><select data-p="${p}f" ${dis('e')}>${FACT.concat(X.fx).map(x=>`<option ${x==r.f?'selected':''}>${esc(x)}</option>`).join('')}</select><label>Employee comments</label>${inp(p+'ec','e','area')}</div><div><h4>Manager review</h4><label>Manager assessment</label>${inp(p+'mr','m','area')}<label>Rating (1–5)</label>${inp(p+'r','m','number')}<label>External (non-controllable) share of outcome gap: ${r.ext}%</label>${inp(p+'ext','m','range')}<label>Evidence for external factors</label>${inp(p+'ev','m','area')}<p class="m">Suggested context-adjusted rating (guide only): <b>${sug}</b></p><label>Decision</label>${inp(p+'dec','m','sel',['Pending','Hold – needs evidence','Ready for appraisal/reward'])}${r.ext>0&&!r.ev?'<div class="warn">External share set but no evidence documented.</div>':''}${r.f!=FACT[0]&&r.ext==0?'<div class="warn">Employee flagged a factor — manager should assess its effect.</div>':''}</div></div></details>`}).join('');
 if(S.tab==4)h+=`<div class="card"><h3>Employee development plan</h3><div class="note">Mix of 70% on-the-job, 20% social/mentoring, 10% formal learning. ${c==='in'?'Discuss career path and role expansion explicitly.':c==='us'?'Tie goals to promotion-packet evidence.':'Align goals with global career ladders.'}</div>${list(P+'dv',[['g','Skill / goal'],['a','Action'],['r','Resource / support'],['du','Due','date'],['s','Status','sel',DS]],'m',{g:'',a:'',r:'',du:'',s:DS[0]})}<p class="m">Employees can propose items by switching to the Employee role in demo; manager/admin finalise.</p></div>`;
 if(S.tab==5)h+=`<div class="card"><h3>Counseling &amp; mentoring</h3><datalist id="mn">${ALL().map(x=>`<option value="${x.name}">`).join('')}</datalist><div class="row"><div><label>Assigned mentor</label>${inp(P+'mt.n','m','text','mn')}<label>Needs identified</label>${inp(P+'mt.need','m','area')}<label>Cadence</label>${inp(P+'mt.cad','m','sel',['Weekly','Fortnightly','Monthly','Quarterly'])}</div><div><label>Objectives</label>${inp(P+'mt.obj','m','area')}<label>Mentoring KPIs</label>${inp(P+'mt.kpi','m','area')}</div></div><div class="note">${c==='in'?'Mentor pairing across levels is natural; encourage mentee to ask questions openly and set agenda.':c==='us'?'Encourage mentee-led agendas and sponsorship conversations in addition to mentoring.':'Consider cross-region mentors for exposure.'}</div><h4>Session log</h4>${list(P+'ms',[['dt','Date','date'],['tp','Topic'],['nt','Notes / follow-up']],'m',{dt:'',tp:'',nt:''})}</div>`;
 return h}
function render(){$('#ctxs').innerHTML=Object.keys(CT).map(k=>`<button data-ctx="${k}" class="${S.ctx==k?'on':''}">${CT[k].ic} ${CT[k].n}</button>`).join('');const A=ALL();
 $('#role').innerHTML='<option value="admin">👤 View as: Admin (HR)</option>'+['L','M','I'].map(l=>`<optgroup label="${LVL[l].n}s">${A.filter(x=>x.lv===l).map(x=>`<option value="${x.id}">${x.name} — ${x.title}</option>`).join('')}</optgroup>`).join('');$('#role').value=S.as;
 let e=A.find(x=>x.id==S.sel);if(e&&!scope(e)){e=null;S.sel=null}$('#app').innerHTML=e?ws(e):dir();save()}
// ---------- Events ----------
document.addEventListener('click',ev=>{const t=ev.target.closest('button,[data-open]');if(!t)return;
 if(t.id==='sv'){save();t.textContent='✓ Saved';setTimeout(()=>t.textContent='💾 Save',1200)}else if(t.id==='addgo'){const n=$('#nn').value.trim(),ti=$('#nt').value.trim();if(!n||!ti){alert('Enter name and designation');return}const e={id:Date.now(),name:n,title:ti,dept:$('#nd').value.trim()||'General',fam:$('#nf').value,reg:$('#nr').value,lv:$('#nl').value,mg:+$('#np').value||0,custom:true};S.custom.push(e);ens(e);S.sel=e.id;S.tab=0;render()}else if(t.dataset.delm){if(confirm('Delete this member and their records?')){{const dm=S.custom.find(x=>x.id==t.dataset.delm);S.custom.forEach(x=>{if(x.mg==t.dataset.delm)x.mg=dm?dm.mg:0})}S.custom=S.custom.filter(x=>x.id!=t.dataset.delm);delete S.d[t.dataset.delm];S.sel=null;render()}}else if(t.dataset.ctx){S.ctx=t.dataset.ctx;render()}else if(t.dataset.open){S.sel=+t.dataset.open;S.tab=0;render()}else if(t.id==='back'||t.id==='home'){S.sel=null;render()}
 else if(t.dataset.tab){S.tab=+t.dataset.tab;render()}
 else if(t.dataset.add){const a=get(t.dataset.add);a.push(JSON.parse(t.dataset.def));render()}
 else if(t.dataset.del){const a=t.dataset.del.split('.'),i=a.pop();get(a.join('.')).splice(i,1);render()}
 else if(t.id==='demofill'){const e=ALL().find(x=>x.id==S.sel),d=ens(e);WT(e,S.ctx).forEach((w,i)=>{d.self[w[0]]=3+(i%3)*.5+.5>5?5:3+(i%3)*.5+.5;d.mgr[w[0]]=3+(i%2)*.5});render()}
 else if(t.id==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='google-pms-data.json';a.click()}
 else if(t.id==='imp')$('#file').click();
 else if(t.id==='rst'&&confirm('Reset all demo edits?')){localStorage.removeItem(KEY);location.reload()}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.cf){const e=S.custom.find(x=>x.id==S.sel);if(e){e[t.dataset.cf]=t.value;save()}}else if(t.dataset.p){set(t.dataset.p,t.type==='range'?+t.value:t.value);save()}else if(t.id==='q'){S.q=t.value;const p=t.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(p,p)}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.p)render();else if(t.id==='dept'){S.dept=t.value;render()}else if(t.id==='role'){S.as=t.value;render()}else if(t.id==='file'){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);S.custom=S.custom||[];S.as=S.as||'admin';render()}catch(e){alert('Invalid file')}};r.readAsText(t.files[0])}});
render();
</script></body></html>
